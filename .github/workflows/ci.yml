name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Unit tests, official-driver tests and multi-process cluster tests
      # (leader loss, minority, snapshot catch-up, chaos).
      - run: cargo test --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyMongo compatibility
        run: |
          pip install pymongo
          cargo build --locked
          ./target/debug/mango --data-dir "$RUNNER_TEMP/pydata" --bind 127.0.0.1:37017 &
          for i in $(seq 1 50); do nc -z 127.0.0.1 37017 && break; sleep 0.2; done
          python tests/compat/pymongo_smoke.py "mongodb://127.0.0.1:37017/?directConnection=true"
      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary deploy/kubernetes/

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
