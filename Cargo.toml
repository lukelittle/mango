[package]
name = "mango"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bson = { version = "3", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
hmac = "0.13.0"
pbkdf2 = "0.13.0"
rand = "0.10.3"
redb = "4.3.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
futures-util = "0.3.34"
mongodb = "3.9.1"
rand = "0.10"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 4
